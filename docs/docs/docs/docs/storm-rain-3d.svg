
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 320" width="100%" height="320">
  <defs>
    <linearGradient id="cloudDark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#475569" stop-opacity="0.98" />
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0.95" />
    </linearGradient>

    <linearGradient id="cloudHighlight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7dd3fc" stop-opacity="0.72" />
      <stop offset="100%" stop-color="#334155" stop-opacity="0.35" />
    </linearGradient>

    <linearGradient id="rainSheet" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.1" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#bae6fd" stop-opacity="0.95" />
    </linearGradient>

    <linearGradient id="floodSurge" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.78" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.48" />
      <stop offset="100%" stop-color="#0369a1" stop-opacity="0.78" />
    </linearGradient>

    <filter id="boltGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="7" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    .title-txt { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 800; fill: #f8fafc; }
    .accent-txt { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 800; fill: #38bdf8; }
    .sub-tag { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; fill: #7dd3fc; letter-spacing: 1.8px; }
    .info-txt { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 13px; fill: #e2e8f0; }
    .stack-txt { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11.5px; font-weight: 700; fill: #bae6fd; }

    .cloud-drift-a { animation: driftCloudA 7s ease-in-out infinite alternate; }
    .cloud-drift-b { animation: driftCloudB 5.5s ease-in-out infinite alternate; }
    .bolt-strike { animation: thunderFlash 3.6s infinite; }
    .rain-fall { animation: downpour 0.85s linear infinite; }
    .rain-fall-slow { animation: downpour 1.15s linear 0.3s infinite; }
    .water-swell { transform-origin: 480px 320px; animation: swellWave 3.2s ease-in-out infinite alternate; }
    .drop-ripple-1 { transform-origin: 730px 268px; animation: rippleOut 1.8s ease-out infinite; }
    .drop-ripple-2 { transform-origin: 830px 276px; animation: rippleOut 1.8s ease-out 0.9s infinite; }

    @keyframes driftCloudA {
      0% { transform: translateX(-10px) translateY(0px); }
      100% { transform: translateX(14px) translateY(-4px); }
    }
    @keyframes driftCloudB {
      0% { transform: translateX(12px) translateY(-3px); }
      100% { transform: translateX(-12px) translateY(3px); }
    }
    @keyframes thunderFlash {
      0%, 82%, 88%, 92%, 100% { opacity: 0.2; }
      84%, 86%, 90% { opacity: 1; }
    }
    @keyframes downpour {
      0% { transform: translate(0px, -90px); opacity: 0; }
      20% { opacity: 0.9; }
      85% { opacity: 0.9; }
      100% { transform: translate(-24px, 165px); opacity: 0; }
    }
    @keyframes swellWave {
      0% { transform: scaleY(0.92); }
      100% { transform: scaleY(1.08); }
    }
    @keyframes rippleOut {
      0% { transform: scale(0.2, 0.08); opacity: 0.95; }
      100% { transform: scale(1.6, 0.65); opacity: 0; }
    }
  </style>

  <!-- Heavy Downpour Rain Streaks -->
  <g class="rain-fall" stroke="url(#rainSheet)" stroke-width="1.8" stroke-linecap="round">
    <line x1="560" y1="110" x2="544" y2="155" />
    <line x1="600" y1="125" x2="584" y2="170" />
    <line x1="640" y1="105" x2="624" y2="150" />
    <line x1="680" y1="130" x2="664" y2="175" />
    <line x1="720" y1="115" x2="704" y2="160" />
    <line x1="760" y1="120" x2="744" y2="165" />
    <line x1="800" y1="108" x2="784" y2="153" />
    <line x1="840" y1="125" x2="824" y2="170" />
    <line x1="880" y1="112" x2="864" y2="157" />
  </g>

  <g class="rain-fall-slow" stroke="url(#rainSheet)" stroke-width="1.4" stroke-linecap="round">
    <line x1="580" y1="100" x2="564" y2="140" />
    <line x1="620" y1="115" x2="604" y2="155" />
    <line x1="660" y1="95" x2="644" y2="135" />
    <line x1="700" y1="120" x2="684" y2="160" />
    <line x1="740" y1="102" x2="724" y2="142" />
    <line x1="780" y1="118" x2="764" y2="158" />
    <line x1="820" y1="105" x2="804" y2="145" />
    <line x1="860" y1="122" x2="844" y2="162" />
  </g>

  <!-- Back Volumetric Storm Cloud -->
  <g class="cloud-drift-a">
    <path d="M 555 105 C 540 75, 580 45, 620 58 C 645 28, 705 28, 730 56 C 770 38, 825 55, 830 90 C 865 92, 880 120, 855 135 L 565 135 C 542 132, 540 112, 555 105 Z" fill="url(#cloudDark)" />
  </g>

  <!-- Front Highlighted 3D Storm Cloud -->
  <g class="cloud-drift-b">
    <path d="M 605 112 C 592 86, 628 62, 665 72 C 690 46, 745 48, 768 74 C 805 58, 855 75, 858 106 C 888 110, 898 132, 875 144 L 615 144 C 594 142, 592 122, 605 112 Z" fill="url(#cloudHighlight)" />
  </g>

  <!-- Thunderstorm Lightning Bolt -->
  <polygon points="732,126 708,176 730,176 714,225 756,166 732,166" fill="#fef08a" stroke="#facc15" stroke-width="1.5" filter="url(#boltGlow)" class="bolt-strike" />

  <!-- Rising Flood / Storm Surge Waves & Rain Ripples -->
  <g class="water-swell">
    <path d="M 0 320 C 80 250, 175 285, 275 242 C 375 282, 475 245, 575 278 C 675 240, 775 282, 875 248 C 915 266, 940 258, 960 270 L 960 320 Z" fill="url(#floodSurge)" />
  </g>
  <ellipse cx="730" cy="268" rx="45" ry="16" fill="none" stroke="#bae6fd" stroke-width="1.5" class="drop-ripple-1" />
  <ellipse cx="830" cy="276" rx="45" ry="16" fill="none" stroke="#7dd3fc" stroke-width="1.5" class="drop-ripple-2" />

  <!-- Crisp Full-Opacity Left Typography -->
  <text x="36" y="64" class="sub-tag">THUNDERSTORM • HEAVY RAINFALL • FLOOD DISPATCH</text>
  <text x="36" y="98" class="title-txt" font-size="21.5">Integrated-Disaster-Reporting-and-</text>
  <text x="36" y="126" class="accent-txt" font-size="21.5">Emergency-Response-System</text>

  <text x="36" y="160" class="info-txt">• SOS distress beacon (600–1200Hz siren + GPS lock) & 150m deduplication</text>
  <text x="36" y="182" class="info-txt">• Live responder GPS telemetry, OSRM routing & 5-stage mission lifecycle</text>
  <text x="36" y="204" class="info-txt">• Automated NDMA SACHET CAP alerts, survival videos & 2FA Admin PIN</text>

  <text x="36" y="242" class="stack-txt">
    Java 21 LTS  ✦  Spring Boot  ✦  MySQL 8.0  ✦  Leaflet GIS  ✦  NDMA SACHET
  </text>
</svg>
