<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Launching Command Center | NDMA Disaster Management</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: radial-gradient(circle at 50% 30%, #0f172a 0%, #050811 100%);
            color: #e2e8f0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 2rem;
            overflow: hidden;
            user-select: none;
        }

        .loader-card {
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(56, 189, 248, 0.25);
            border-radius: 20px;
            padding: 3rem 2.5rem;
            max-width: 600px;
            width: 100%;
            text-align: center;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.8), 0 0 40px rgba(14, 165, 233, 0.15);
            position: relative;
        }

        .radar-container {
            position: relative;
            width: 100px;
            height: 100px;
            margin: 0 auto 2rem;
        }

        .radar-ring {
            position: absolute;
            inset: 0;
            border-radius: 50%;
            border: 2px solid rgba(56, 189, 248, 0.4);
            animation: pulse-ring 2.4s cubic-bezier(0.215, 0.61, 0.355, 1) infinite;
        }

        .radar-ring:nth-child(2) {
            animation-delay: 0.8s;
        }

        .radar-core {
            position: absolute;
            inset: 12px;
            border-radius: 50%;
            background: linear-gradient(135deg, #0284c7, #2563eb);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.2rem;
            box-shadow: 0 0 25px rgba(56, 189, 248, 0.6);
        }

        @keyframes pulse-ring {
            0% {
                transform: scale(0.6);
                opacity: 0.9;
            }
            80%, 100% {
                transform: scale(1.6);
                opacity: 0;
            }
        }

        h1 {
            font-size: 1.35rem;
            font-weight: 700;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            color: #ffffff;
            margin-bottom: 0.5rem;
            background: linear-gradient(135deg, #ffffff 40%, #93c5fd);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle {
            font-size: 0.85rem;
            color: #94a3b8;
            margin-bottom: 2rem;
            letter-spacing: 0.04em;
        }

        .progress-wrapper {
            background: rgba(15, 23, 42, 0.9);
            border: 1px solid #1e293b;
            border-radius: 9999px;
            height: 10px;
            overflow: hidden;
            position: relative;
            margin-bottom: 1.25rem;
        }

        .progress-bar {
            height: 100%;
            width: 15%;
            background: linear-gradient(90deg, #0ea5e9, #38bdf8, #60a5fa);
            border-radius: 9999px;
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.8);
            transition: width 0.4s ease;
        }

        .status-telemetry {
            font-size: 0.82rem;
            font-family: 'Consolas', 'Courier New', monospace;
            color: #38bdf8;
            min-height: 1.4rem;
            margin-bottom: 1.5rem;
        }

        .meta-badges {
            display: flex;
            justify-content: center;
            gap: 0.6rem;
            flex-wrap: wrap;
            margin-bottom: 1.5rem;
        }

        .badge {
            background: rgba(30, 41, 59, 0.8);
            border: 1px solid #334155;
            padding: 0.3rem 0.75rem;
            border-radius: 6px;
            font-size: 0.75rem;
            color: #cbd5e1;
            font-family: monospace;
        }

        .footer-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid #1e293b;
            padding-top: 1.25rem;
            font-size: 0.78rem;
            color: #64748b;
        }

        .btn-link {
            background: transparent;
            border: 1px solid #334155;
            color: #94a3b8;
            padding: 0.4rem 0.8rem;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.78rem;
            transition: all 0.2s;
        }
        .btn-link:hover {
            color: #ffffff;
            border-color: #38bdf8;
            background: rgba(56, 189, 248, 0.1);
        }
    </style>
</head>
<body>
    <div class="loader-card">
        <div class="radar-container">
            <div class="radar-ring"></div>
            <div class="radar-ring"></div>
            <div class="radar-core">🛡️</div>
        </div>

        <h1>NDMA Tactical Command Center</h1>
        <div class="subtitle">Integrated Disaster Reporting & Emergency Response Platform</div>

        <div class="progress-wrapper">
            <div class="progress-bar" id="progressBar"></div>
        </div>

        <div class="status-telemetry" id="statusMessage">
            Initializing runtime environment...
        </div>

        <div class="meta-badges">
            <span class="badge" id="backendBadge">Target: http://localhost:8080</span>
            <span class="badge">Engine: Spring Boot 21</span>
            <span class="badge">Persistence: MySQL 8</span>
        </div>

        <div class="footer-actions">
            <span id="elapsedDisplay">Starting up...</span>
            <button class="btn-link" onclick="openServerConfig()">Change Server Target</button>
        </div>
    </div>

    <script>
        const statusSteps = [
            { pct: 20, msg: "Probing backend service port..." },
            { pct: 35, msg: "Starting Spring Boot core microservice..." },
            { pct: 55, msg: "Synchronizing MySQL data connection..." },
            { pct: 75, msg: "Verifying NDMA SACHET alert feed pipelines..." },
            { pct: 90, msg: "Loading Citizen, Admin & Responder command modules..." },
            { pct: 100, msg: "Connection established. Launching Command Portal..." }
        ];

        let stepIndex = 0;
        let startTime = Date.now();

        async function init() {
            if (window.desktopAPI) {
                const targetUrl = await window.desktopAPI.getServerUrl();
                document.getElementById('backendBadge').innerText = 'Target: ' + targetUrl;
            }

            const interval = setInterval(() => {
                if (stepIndex < statusSteps.length - 1) {
                    stepIndex++;
                    const step = statusSteps[stepIndex];
                    document.getElementById('progressBar').style.width = step.pct + '%';
                    document.getElementById('statusMessage').innerText = step.msg;
                }

                const elapsedSec = Math.floor((Date.now() - startTime) / 1000);
                document.getElementById('elapsedDisplay').innerText = `Elapsed: ${elapsedSec}s`;
            }, 3000);
        }

        function openServerConfig() {
            window.location.href = 'connection-error.html';
        }

        init();
    </script>
</body>
</html>
