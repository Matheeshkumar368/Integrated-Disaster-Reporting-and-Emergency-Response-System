# In-Memory Test Database (H2) - Isolates tests from live MySQL database
spring.datasource.url=jdbc:h2:mem:disaster_test_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate for Tests
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Test JWT Secret
app.jwt.secret=test-secret-key-for-testing-purposes-must-be-long-enough-2026-disaster
app.jwt.expiration-ms=3600000
app.admin.step-up-duration-minutes=15

# Actuator
management.endpoints.web.exposure.include=health,info

