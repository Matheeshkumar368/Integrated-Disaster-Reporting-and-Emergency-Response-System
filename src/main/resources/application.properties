# Server Configuration
server.port=${PORT:8080}

# Application Identification
spring.application.name=disaster-management

# Database Configuration (MySQL)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/disaster_management?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# HikariCP Connection Pool Settings
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1200000
spring.datasource.hikari.connection-test-query=SELECT 1

# JPA / Hibernate Settings
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=false

# Prepared Statement Cache
spring.datasource.hikari.cache-prep-stmts=true
spring.datasource.hikari.prep-stmt-cache-size=250
spring.datasource.hikari.prep-stmt-cache-sql-limit=2048

# Security & JWT Configuration
app.jwt.secret=${JWT_SECRET:disaster-management-academic-super-secure-jwt-secret-key-2026-disaster-response-system-368}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
app.admin.step-up-duration-minutes=${ADMIN_STEP_UP_MINUTES:15}

# Actuator Endpoints for Health and Readiness Monitoring
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true

# NDMA SACHET Live Feed Configuration
app.ndma.rss-url=${NDMA_RSS_URL:https://sachet.ndma.gov.in/cap_public_website/rss/rss_india.xml}
app.ndma.sync.enabled=${NDMA_SYNC_ENABLED:true}
app.ndma.sync.interval-ms=${NDMA_SYNC_INTERVAL_MS:300000}
app.ndma.sync.initial-delay-ms=${NDMA_SYNC_INITIAL_DELAY_MS:5000}
app.ndma.sync.max-items=${NDMA_SYNC_MAX_ITEMS:30}

# IMD & Meteorological Weather Service Configuration
app.imd.api-url=${IMD_API_URL:https://api.imd.gov.in/api}
app.imd.api-key=${IMD_API_KEY:}
app.imd.jwt-token=${IMD_JWT_TOKEN:}
app.weather.fallback-url=${WEATHER_FALLBACK_URL:https://api.open-meteo.com/v1/forecast}


# Media Upload Configuration
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=55MB
app.media.upload-dir=${MEDIA_UPLOAD_DIR:uploads/incident-media}

# Routing & Navigation Service
app.routing.osrm-url=${OSRM_URL:https://router.project-osrm.org/route/v1/driving}
app.routing.timeout-ms=${ROUTING_TIMEOUT_MS:3000}
