<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"/>
    <meta http-equiv="Pragma" content="no-cache"/>
    <meta http-equiv="Expires" content="0"/>
    <title>Analytics & Reports - Disaster Management</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(135deg, #0f1a2a 0%, #0a1420 100%);
            color: #e0e0e0;
            min-height: 100vh;
            padding-bottom: 5rem;
        }
        .header {
            background: linear-gradient(135deg, #1e3a8a, #3b82f6);
            padding: 1.8rem 1rem;
            text-align: center;
            box-shadow: 0 6px 20px rgba(0,0,0,0.5);
        }
        .header h1 {
            font-size: 2.4rem;
            color: white;
            font-weight: 700;
            text-shadow: 0 2px 8px rgba(0,0,0,0.4);
        }
        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 1.5rem;
        }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 1.5rem;
            margin-bottom: 2rem;
        }
        .stat-card {
            background: rgba(30, 41, 59, 0.95);
            border-radius: 16px;
            padding: 1.5rem;
            box-shadow: 0 8px 30px rgba(0,0,0,0.5);
            border-left: 4px solid;
            transition: transform 0.3s;
        }
        .stat-card:hover {
            transform: translateY(-5px);
        }
        .stat-card.total { border-left-color: #3b82f6; }
        .stat-card.active { border-left-color: #ef4444; }
        .stat-card.acknowledged { border-left-color: #f59e0b; }
        .stat-card.resolved { border-left-color: #22c55e; }
        .stat-icon {
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
        }
        .stat-number {
            font-size: 3rem;
            font-weight: bold;
            margin: 0.5rem 0;
        }
        .stat-label {
            color: #94a3b8;
            font-size: 1.1rem;
        }
        .charts-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
            gap: 1.5rem;
            margin-bottom: 2rem;
        }
        .chart-card {
            background: rgba(30, 41, 59, 0.95);
            border-radius: 16px;
            padding: 1.5rem;
            box-shadow: 0 8px 30px rgba(0,0,0,0.5);
        }
        .chart-card h3 {
            color: #3b82f6;
            margin-bottom: 1rem;
            font-size: 1.3rem;
        }
        .table-card {
            background: rgba(30, 41, 59, 0.95);
            border-radius: 16px;
            padding: 1.5rem;
            box-shadow: 0 8px 30px rgba(0,0,0,0.5);
            margin-bottom: 2rem;
        }
        .table-card h3 {
            color: #3b82f6;
            margin-bottom: 1rem;
            font-size: 1.3rem;
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th, td {
            padding: 1rem;
            text-align: left;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        th {
            background: rgba(59,130,246,0.2);
            color: #3b82f6;
            font-weight: 600;
        }
        tr:hover {
            background: rgba(255,255,255,0.05);
        }
        .badge {
            padding: 0.3rem 0.8rem;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: 600;
        }
        .badge.high { background: rgba(239,68,68,0.2); color: #ef4444; }
        .badge.medium { background: rgba(245,158,11,0.2); color: #f59e0b; }
        .badge.low { background: rgba(16,185,129,0.2); color: #10b981; }
        .badge.active { background: rgba(239,68,68,0.2); color: #ef4444; }
        .badge.acknowledged { background: rgba(59,130,246,0.2); color: #3b82f6; }
        .badge.resolved { background: rgba(34,197,94,0.2); color: #22c55e; }
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: #1e293b;
            display: flex;
            justify-content: space-around;
            padding: 1rem 0;
            box-shadow: 0 -6px 20px rgba(0,0,0,0.5);
            z-index: 1000;
        }
        .bottom-nav a {
            color: #94a3b8;
            text-decoration: none;
            text-align: center;
            font-size: 0.95rem;
            transition: all 0.3s;
        }
        .bottom-nav a i {
            font-size: 1.9rem;
            display: block;
            margin-bottom: 0.4rem;
        }
        .bottom-nav a.active,
        .bottom-nav a:hover {
            color: #3b82f6;
            transform: translateY(-3px);
        }
        @media (max-width: 768px) {
            .charts-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

<div class="header">
    <h1><i class="fas fa-chart-line"></i> Analytics & Reports</h1>
</div>

<div class="container">
    <!-- Statistics Cards -->
    <div class="stats-grid">
        <div class="stat-card total">
            <div class="stat-icon" style="color:#3b82f6;">
                <i class="fas fa-bell"></i>
            </div>
            <div class="stat-number" id="totalAlerts">0</div>
            <div class="stat-label">Total Alerts</div>
        </div>
        
        <div class="stat-card active">
            <div class="stat-icon" style="color:#ef4444;">
                <i class="fas fa-exclamation-triangle"></i>
            </div>
            <div class="stat-number" id="activeAlerts">0</div>
            <div class="stat-label">Active Alerts</div>
        </div>
        
        <div class="stat-card acknowledged">
            <div class="stat-icon" style="color:#f59e0b;">
                <i class="fas fa-check-circle"></i>
            </div>
            <div class="stat-number" id="acknowledgedAlerts">0</div>
            <div class="stat-label">Acknowledged</div>
        </div>
        
        <div class="stat-card resolved">
            <div class="stat-icon" style="color:#22c55e;">
                <i class="fas fa-check-double"></i>
            </div>
            <div class="stat-number" id="resolvedAlerts">0</div>
            <div class="stat-label">Resolved</div>
        </div>
    </div>

    <!-- Charts -->
    <div class="charts-grid">
        <div class="chart-card">
            <h3><i class="fas fa-chart-pie"></i> Alerts by Severity</h3>
            <canvas id="severityChart"></canvas>
        </div>
        
        <div class="chart-card">
            <h3><i class="fas fa-chart-bar"></i> Alerts by Region</h3>
            <canvas id="regionChart"></canvas>
        </div>
        
        <div class="chart-card">
            <h3><i class="fas fa-chart-doughnut"></i> Alerts by Type</h3>
            <canvas id="typeChart"></canvas>
        </div>
        
        <div class="chart-card">
            <h3><i class="fas fa-chart-area"></i> Alert Status Distribution</h3>
            <canvas id="statusChart"></canvas>
        </div>
    </div>

    <!-- Recent Alerts Table -->
    <div class="table-card">
        <h3><i class="fas fa-table"></i> Recent Alerts</h3>
        <div style="overflow-x:auto;">
            <table id="alertsTable">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Title</th>
                        <th>Type</th>
                        <th>Severity</th>
                        <th>Region</th>
                        <th>Status</th>
                        <th>Created</th>
                    </tr>
                </thead>
                <tbody id="alertsTableBody">
                    <tr>
                        <td colspan="7" style="text-align:center;padding:2rem;color:#64748b;">
                            <i class="fas fa-spinner fa-spin" style="font-size:2rem;"></i>
                            <p style="margin-top:1rem;">Loading alerts...</p>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<nav class="bottom-nav">
    <a href="/admin-dashboard.html">
        <i class="fas fa-tachometer-alt"></i>
        <span>Dashboard</span>
    </a>
    <a href="/reports.html" class="active">
        <i class="fas fa-chart-bar"></i>
        <span>Reports</span>
    </a>
    <a href="/admin-profile.html">
        <i class="fas fa-user-shield"></i>
        <span>Profile</span>
    </a>
</nav>

<script src="/js/emergency-alert.js"></script>
<script>
    // Access Control - Only Admin can access this page
    (function() {
        const token = localStorage.getItem('token');
        if (!token) {
            window.location.href = '/index.html';
            return;
        }
        try {
            const payload = JSON.parse(atob(token.split('.')[1]));
            const role = payload.role;
            if (role !== 'Admin') {
                alert('Access Denied: This page is for Admin only');
                if (role === 'Responder') {
                    window.location.href = '/responder-dashboard.html';
                } else if (role === 'Citizen') {
                    window.location.href = '/citizen-dashboard.html';
                } else {
                    window.location.href = '/index.html';
                }
            }
        } catch (e) {
            window.location.href = '/index.html';
        }
    })();

    let severityChart, regionChart, typeChart, statusChart;

    // Role-based dashboard redirect
    function goToDashboard() {
        const token = localStorage.getItem('token');
        const storedRole = localStorage.getItem('userRole');
        if (!token) {
            window.location.href = '/index.html';
            return;
        }
        try {
            const payload = JSON.parse(atob(token.split('.')[1]));
            const role = storedRole || payload.role || 'Citizen';
            if (role === 'Admin') {
                window.location.href = '/admin-dashboard.html';
            } else if (role === 'Responder') {
                window.location.href = '/responder-dashboard.html';
            } else {
                window.location.href = '/citizen-dashboard.html';
            }
        } catch (e) {
            // Try stored role
            if (storedRole === 'Admin') {
                window.location.href = '/admin-dashboard.html';
            } else if (storedRole === 'Responder') {
                window.location.href = '/responder-dashboard.html';
            } else {
                localStorage.removeItem('token');
                localStorage.removeItem('userRole');
                window.location.href = '/index.html';
            }
        }
    }

    // Load all data
    function loadReports() {
        fetch('/api/alerts')
            .then(res => res.json())
            .then(alerts => {
                updateStatistics(alerts);
                updateCharts(alerts);
                updateTable(alerts);
            })
            .catch(err => {
                console.error('Error loading reports:', err);
            });
    }

    // Update statistics cards
    function updateStatistics(alerts) {
        document.getElementById('totalAlerts').innerText = alerts.length;
        document.getElementById('activeAlerts').innerText = alerts.filter(a => a.status === 'Active').length;
        document.getElementById('acknowledgedAlerts').innerText = alerts.filter(a => a.status === 'Acknowledged').length;
        document.getElementById('resolvedAlerts').innerText = alerts.filter(a => a.status === 'Resolved').length;
    }

    // Update charts
    function updateCharts(alerts) {
        // Severity Chart
        const severityCounts = {
            'High': alerts.filter(a => a.severity === 'High').length,
            'Medium': alerts.filter(a => a.severity === 'Medium').length,
            'Low': alerts.filter(a => a.severity === 'Low').length
        };

        if (severityChart) severityChart.destroy();
        severityChart = new Chart(document.getElementById('severityChart'), {
            type: 'pie',
            data: {
                labels: ['High', 'Medium', 'Low'],
                datasets: [{
                    data: [severityCounts.High, severityCounts.Medium, severityCounts.Low],
                    backgroundColor: ['#ef4444', '#f59e0b', '#10b981']
                }]
            },
            options: {
                responsive: true,
                plugins: {
                    legend: { labels: { color: '#e0e0e0' } }
                }
            }
        });

        // Region Chart
        const regionCounts = {};
        alerts.forEach(a => {
            regionCounts[a.region] = (regionCounts[a.region] || 0) + 1;
        });

        if (regionChart) regionChart.destroy();
        regionChart = new Chart(document.getElementById('regionChart'), {
            type: 'bar',
            data: {
                labels: Object.keys(regionCounts),
                datasets: [{
                    label: 'Alerts by Region',
                    data: Object.values(regionCounts),
                    backgroundColor: '#3b82f6'
                }]
            },
            options: {
                responsive: true,
                plugins: {
                    legend: { labels: { color: '#e0e0e0' } }
                },
                scales: {
                    y: { ticks: { color: '#e0e0e0' }, grid: { color: 'rgba(255,255,255,0.1)' } },
                    x: { ticks: { color: '#e0e0e0' }, grid: { color: 'rgba(255,255,255,0.1)' } }
                }
            }
        });

        // Type Chart
        const typeCounts = {};
        alerts.forEach(a => {
            typeCounts[a.disasterType] = (typeCounts[a.disasterType] || 0) + 1;
        });

        if (typeChart) typeChart.destroy();
        typeChart = new Chart(document.getElementById('typeChart'), {
            type: 'doughnut',
            data: {
                labels: Object.keys(typeCounts),
                datasets: [{
                    data: Object.values(typeCounts),
                    backgroundColor: ['#ef4444', '#f59e0b', '#10b981', '#3b82f6', '#7c3aed', '#ec4899']
                }]
            },
            options: {
                responsive: true,
                plugins: {
                    legend: { labels: { color: '#e0e0e0' } }
                }
            }
        });

        // Status Chart
        const statusCounts = {
            'Active': alerts.filter(a => a.status === 'Active').length,
            'Acknowledged': alerts.filter(a => a.status === 'Acknowledged').length,
            'Resolved': alerts.filter(a => a.status === 'Resolved').length
        };

        if (statusChart) statusChart.destroy();
        statusChart = new Chart(document.getElementById('statusChart'), {
            type: 'bar',
            data: {
                labels: ['Active', 'Acknowledged', 'Resolved'],
                datasets: [{
                    label: 'Alert Status',
                    data: [statusCounts.Active, statusCounts.Acknowledged, statusCounts.Resolved],
                    backgroundColor: ['#ef4444', '#f59e0b', '#22c55e']
                }]
            },
            options: {
                responsive: true,
                plugins: {
                    legend: { labels: { color: '#e0e0e0' } }
                },
                scales: {
                    y: { ticks: { color: '#e0e0e0' }, grid: { color: 'rgba(255,255,255,0.1)' } },
                    x: { ticks: { color: '#e0e0e0' }, grid: { color: 'rgba(255,255,255,0.1)' } }
                }
            }
        });
    }

    // Update table
    function updateTable(alerts) {
        const tbody = document.getElementById('alertsTableBody');
        tbody.innerHTML = '';

        if (alerts.length === 0) {
            tbody.innerHTML = '<tr><td colspan="7" style="text-align:center;padding:2rem;color:#64748b;">No alerts found</td></tr>';
            return;
        }

        // Show latest 10 alerts
        alerts.slice(0, 10).forEach(alert => {
            const row = document.createElement('tr');
            row.innerHTML = `
                <td>#${alert.alertId}</td>
                <td>${alert.title}</td>
                <td>${alert.disasterType}</td>
                <td><span class="badge ${alert.severity.toLowerCase()}">${alert.severity}</span></td>
                <td>${alert.region}</td>
                <td><span class="badge ${alert.status.toLowerCase()}">${alert.status}</span></td>
                <td>${new Date(alert.createdAt).toLocaleDateString('en-IN')}</td>
            `;
            tbody.appendChild(row);
        });
    }

    // Load reports on page load
    loadReports();
    setInterval(loadReports, 60000); // Refresh every minute
</script>

</body>
</html>
