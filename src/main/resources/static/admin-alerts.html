<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Admin - Broadcast Alert</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(135deg, #0f1a2a 0%, #0a1420 100%);
            color: #e0e0e0;
            min-height: 100vh;
            padding-bottom: 5rem;
        }
        .header {
            background: linear-gradient(135deg, #dc2626, #ef4444);
            padding: 1.8rem 1rem;
            text-align: center;
            box-shadow: 0 6px 20px rgba(0,0,0,0.5);
        }
        .header h1 {
            font-size: 2.4rem;
            color: white;
            font-weight: 700;
            text-shadow: 0 2px 8px rgba(0,0,0,0.4);
        }
        .container {
            max-width: 800px;
            margin: 2rem auto;
            padding: 0 1.5rem;
        }
        .form-card {
            background: rgba(30, 41, 59, 0.95);
            border-radius: 16px;
            padding: 2rem;
            box-shadow: 0 8px 30px rgba(0,0,0,0.5);
            border: 1px solid rgba(239,68,68,0.2);
        }
        .form-group {
            margin-bottom: 1.5rem;
        }
        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            color: #94a3b8;
            font-size: 1.05rem;
            font-weight: 500;
        }
        .form-group input,
        .form-group textarea,
        .form-group select {
            width: 100%;
            padding: 1rem;
            border: 1px solid #334155;
            border-radius: 8px;
            background: #1e293b;
            color: white;
            font-size: 1rem;
            font-family: inherit;
        }
        .form-group textarea {
            min-height: 120px;
            resize: vertical;
        }
        .form-group input:focus,
        .form-group textarea:focus,
        .form-group select:focus {
            outline: none;
            border-color: #ef4444;
        }
        .btn-broadcast {
            width: 100%;
            padding: 1.2rem;
            background: linear-gradient(135deg, #dc2626, #ef4444);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1.2rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }
        .btn-broadcast:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(239,68,68,0.4);
        }
        .btn-broadcast:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .message {
            padding: 1rem;
            border-radius: 8px;
            margin-bottom: 1.5rem;
            text-align: center;
            font-weight: 500;
        }
        .message.success {
            background: rgba(34,197,94,0.2);
            color: #22c55e;
            border: 1px solid #22c55e;
        }
        .message.error {
            background: rgba(239,68,68,0.2);
            color: #ef4444;
            border: 1px solid #ef4444;
        }
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: #1e293b;
            display: flex;
            justify-content: space-around;
            padding: 1rem 0;
            box-shadow: 0 -6px 20px rgba(0,0,0,0.5);
            z-index: 1000;
        }
        .bottom-nav a {
            color: #94a3b8;
            text-decoration: none;
            text-align: center;
            font-size: 0.95rem;
            transition: all 0.3s;
        }
        .bottom-nav a i {
            font-size: 1.9rem;
            display: block;
            margin-bottom: 0.4rem;
        }
        .bottom-nav a.active,
        .bottom-nav a:hover {
            color: #ef4444;
            transform: translateY(-3px);
        }
    </style>
</head>
<body>

<div class="header">
    <h1><i class="fas fa-broadcast-tower"></i> Broadcast Emergency Alert</h1>
</div>

<div class="container">
    <div class="form-card">
        <div id="messageBox"></div>
        
        <form id="alertForm">
            <div class="form-group">
                <label for="title"><i class="fas fa-heading"></i> Alert Title</label>
                <input type="text" id="title" placeholder="e.g., Heavy Rainfall Warning" required />
            </div>

            <div class="form-group">
                <label for="message"><i class="fas fa-comment-alt"></i> Alert Message</label>
                <textarea id="message" placeholder="Describe the alert details and safety instructions..." required></textarea>
            </div>

            <div class="form-group">
                <label for="disasterType"><i class="fas fa-exclamation-triangle"></i> Disaster Type</label>
                <select id="disasterType" required>
                    <option value="">Select Type</option>
                    <option value="Cyclone">Cyclone</option>
                    <option value="Heavy Rain">Heavy Rain</option>
                    <option value="Flood">Flood</option>
                    <option value="Earthquake">Earthquake</option>
                    <option value="Dense Fog">Dense Fog</option>
                    <option value="Landslide">Landslide</option>
                    <option value="Other">Other</option>
                </select>
            </div>

            <div class="form-group">
                <label for="severity"><i class="fas fa-exclamation-circle"></i> Severity Level</label>
                <select id="severity" required>
                    <option value="">Select Severity</option>
                    <option value="High">High</option>
                    <option value="Medium">Medium</option>
                    <option value="Low">Low</option>
                </select>
            </div>

            <div class="form-group">
                <label for="region"><i class="fas fa-map-marker-alt"></i> Region</label>
                <select id="region" required>
                    <option value="">Select Region</option>
                    <option value="Chennai">Chennai</option>
                    <option value="Coimbatore">Coimbatore</option>
                    <option value="Madurai">Madurai</option>
                    <option value="Tiruchirappalli">Tiruchirappalli</option>
                    <option value="Salem">Salem</option>
                    <option value="Tirunelveli">Tirunelveli</option>
                    <option value="Dindigul">Dindigul</option>
                    <option value="Vellore">Vellore</option>
                    <option value="Erode">Erode</option>
                    <option value="Thoothukudi">Thoothukudi</option>
                    <option value="Tamil Nadu">Tamil Nadu (All)</option>
                </select>
            </div>

            <button type="submit" class="btn-broadcast" id="submitBtn">
                <i class="fas fa-paper-plane"></i> Broadcast Alert
            </button>
        </form>
    </div>
</div>

<nav class="bottom-nav">
    <a href="/admin-dashboard.html">
        <i class="fas fa-tachometer-alt"></i>
        <span>Dashboard</span>
    </a>
    <a href="/alerts.html">
        <i class="fas fa-bell"></i>
        <span>Alerts</span>
    </a>
    <a href="/admin-alerts.html" class="active">
        <i class="fas fa-broadcast-tower"></i>
        <span>Broadcast</span>
    </a>
    <a href="/admin-profile.html">
        <i class="fas fa-user-shield"></i>
        <span>Profile</span>
    </a>
</nav>

<script src="/js/emergency-alert.js"></script>
<script>
    const form = document.getElementById('alertForm');
    const messageBox = document.getElementById('messageBox');
    const submitBtn = document.getElementById('submitBtn');

    // Check if user is Admin
    const token = localStorage.getItem('token');
    if (!token) {
        window.location.href = '/index.html';
    } else {
        try {
            const payload = JSON.parse(atob(token.split('.')[1]));
            if (payload.role !== 'Admin') {
                alert('Access Denied: Only Admin can broadcast alerts');
                window.location.href = 'citizen-dashboard.html';
            }
        } catch (e) {
            window.location.href = '/index.html';
        }
    }

    function showMessage(text, type) {
        messageBox.innerHTML = `<div class="message ${type}">${text}</div>`;
        setTimeout(() => {
            messageBox.innerHTML = '';
        }, 5000);
    }

    form.addEventListener('submit', async (e) => {
        e.preventDefault();

        const alertData = {
            title: document.getElementById('title').value,
            message: document.getElementById('message').value,
            disasterType: document.getElementById('disasterType').value,
            severity: document.getElementById('severity').value,
            region: document.getElementById('region').value
        };

        submitBtn.disabled = true;
        submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Broadcasting...';

        try {
            const response = await fetch('/api/alerts', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${token}`
                },
                body: JSON.stringify(alertData)
            });

            if (response.ok) {
                showMessage('✓ Alert broadcasted successfully!', 'success');
                form.reset();
            } else {
                const error = await response.text();
                showMessage('✗ Failed to broadcast alert: ' + error, 'error');
            }
        } catch (error) {
            showMessage('✗ Network error: ' + error.message, 'error');
        } finally {
            submitBtn.disabled = false;
            submitBtn.innerHTML = '<i class="fas fa-paper-plane"></i> Broadcast Alert';
        }
    });
</script>

</body>
</html>
