<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Responder Accreditation Registration | NDMA Emergency Portal</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="command-center.css?v=3">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Inter', sans-serif;
            background: #050811;
            min-height: 100vh;
            color: #e0e0e0;
            padding: 2rem 1rem;
        }
        
        .container {
            max-width: 600px;
            margin: 0 auto;
        }
        
        .header {
            text-align: center;
            margin-bottom: 2rem;
        }
        
        .header h1 {
            font-size: 2rem;
            color: #3b82f6;
            margin-bottom: 0.5rem;
        }
        
        .header p {
            color: #94a3b8;
        }
        
        .registration-card {
            background: rgba(30, 41, 59, 0.95);
            border-radius: 16px;
            padding: 2rem;
            box-shadow: 0 8px 30px rgba(0,0,0,0.5);
            border: 1px solid rgba(59,130,246,0.2);
        }
        
        .form-group {
            margin-bottom: 1.5rem;
        }
        
        .form-group label {
            display: block;
            color: #94a3b8;
            margin-bottom: 0.5rem;
            font-weight: 500;
        }
        
        .form-group label i {
            margin-right: 0.5rem;
            color: #3b82f6;
        }
        
        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 0.8rem;
            border: 1px solid #334155;
            border-radius: 8px;
            background: #1e293b;
            color: white;
            font-size: 1rem;
            font-family: inherit;
        }
        
        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59,130,246,0.2);
        }
        
        .form-group input::placeholder,
        .form-group textarea::placeholder {
            color: #64748b;
        }
        
        .form-group select {
            appearance: none;
            -webkit-appearance: none;
            background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='white'%3e%3cpath d='M7 10l5 5 5-5z'/%3e%3c/svg%3e");
            background-repeat: no-repeat;
            background-position: right 10px center;
            background-size: 20px;
            padding-right: 40px;
        }
        
        .form-group select option {
            background: #1e293b;
            color: white;
        }
        
        .form-group textarea {
            min-height: 100px;
            resize: vertical;
        }
        
        .group-options {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1rem;
        }
        
        .group-option {
            position: relative;
        }
        
        .group-option input {
            position: absolute;
            opacity: 0;
        }
        
        .group-option label {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 1rem;
            background: rgba(255,255,255,0.05);
            border: 2px solid #334155;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .group-option label:hover {
            border-color: #3b82f6;
            background: rgba(59,130,246,0.1);
        }
        
        .group-option input:checked + label {
            border-color: #3b82f6;
            background: rgba(59,130,246,0.2);
        }
        
        .group-option label i {
            font-size: 2rem;
            margin-bottom: 0.5rem;
            color: #60a5fa;
        }
        
        .group-option label span {
            font-size: 0.9rem;
            color: #94a3b8;
        }
        
        .group-option input:checked + label i {
            color: #3b82f6;
        }
        
        .group-option input:checked + label span {
            color: #3b82f6;
        }
        
        .btn-submit {
            width: 100%;
            padding: 1rem;
            background: linear-gradient(135deg, #1d4ed8, #3b82f6);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(59,130,246,0.4);
        }
        
        .btn-submit:disabled {
            background: #334155;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }
        
        .message {
            padding: 1rem;
            border-radius: 8px;
            margin-bottom: 1rem;
            text-align: center;
        }
        
        .message.success {
            background: rgba(34,197,94,0.2);
            color: #22c55e;
            border: 1px solid #22c55e;
        }
        
        .message.error {
            background: rgba(239,68,68,0.2);
            color: #ef4444;
            border: 1px solid #ef4444;
        }
        
        .back-link {
            text-align: center;
            margin-top: 1.5rem;
        }
        
        .back-link a {
            color: #60a5fa;
            text-decoration: none;
        }
        
        .back-link a:hover {
            text-decoration: underline;
        }
        
        .required {
            color: #ef4444;
        }
        
        .password-strength {
            height: 4px;
            background: #334155;
            border-radius: 2px;
            margin-top: 0.5rem;
            overflow: hidden;
        }
        
        .password-strength-bar {
            height: 100%;
            width: 0;
            transition: all 0.3s;
        }
        
        .password-strength-bar.weak { width: 33%; background: #ef4444; }
        .password-strength-bar.medium { width: 66%; background: #f59e0b; }
        .password-strength-bar.strong { width: 100%; background: #22c55e; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1><i class="fas fa-user-plus"></i> Responder Registration</h1>
        <p>Join the Emergency Response Team</p>
    </div>
    
    <div id="messageBox"></div>
    
    <div class="registration-card">
        <form id="registrationForm">
            <div class="form-group">
                <label><i class="fas fa-user"></i> Full Name <span class="required">*</span></label>
                <input type="text" id="name" placeholder="Enter your full name" required>
            </div>
            
            <div class="form-group">
                <label><i class="fas fa-envelope"></i> Email Address <span class="required">*</span></label>
                <input type="email" id="email" placeholder="Enter your email address" required>
            </div>
            
            <div class="form-group">
                <label><i class="fas fa-lock"></i> Password <span class="required">*</span></label>
                <input type="password" id="password" placeholder="Create a password" required minlength="6">
                <div class="password-strength">
                    <div class="password-strength-bar" id="strengthBar"></div>
                </div>
            </div>
            
            <div class="form-group">
                <label><i class="fas fa-phone"></i> Phone Number <span class="required">*</span></label>
                <input type="tel" id="phone" placeholder="e.g., +91 9876543210" required pattern="[\+]?[0-9\s]{10,15}">
            </div>
            
            <div class="form-group">
                <label><i class="fas fa-map-marker-alt"></i> Location/Area <span class="required">*</span></label>
                <select id="location" required>
                    <option value="">Select your operational area</option>
                    <option value="Chennai">Chennai</option>
                    <option value="Coimbatore">Coimbatore</option>
                    <option value="Madurai">Madurai</option>
                    <option value="Tiruchirappalli">Tiruchirappalli</option>
                    <option value="Salem">Salem</option>
                    <option value="Tirunelveli">Tirunelveli</option>
                    <option value="Erode">Erode</option>
                    <option value="Vellore">Vellore</option>
                    <option value="Thoothukudi">Thoothukudi</option>
                    <option value="Dindigul">Dindigul</option>
                    <option value="Thanjavur">Thanjavur</option>
                    <option value="Nagercoil">Nagercoil</option>
                </select>
            </div>
            
            <div class="form-group">
                <label><i class="fas fa-users"></i> Group Classification <span class="required">*</span></label>
                <div class="group-options">
                    <div class="group-option">
                        <input type="radio" name="groupClassification" id="groupLeader" value="Leader" required>
                        <label for="groupLeader">
                            <i class="fas fa-crown"></i>
                            <span>Leader</span>
                        </label>
                    </div>
                    <div class="group-option">
                        <input type="radio" name="groupClassification" id="groupHelper" value="Helper">
                        <label for="groupHelper">
                            <i class="fas fa-hands-helping"></i>
                            <span>Helper</span>
                        </label>
                    </div>
                    <div class="group-option">
                        <input type="radio" name="groupClassification" id="groupRescuer" value="Rescuer">
                        <label for="groupRescuer">
                            <i class="fas fa-first-aid"></i>
                            <span>Rescuer</span>
                        </label>
                    </div>
                </div>
            </div>
            
            <div class="form-group">
                <label><i class="fas fa-info-circle"></i> Additional Details</label>
                <textarea id="additionalDetails" placeholder="Any relevant experience, skills, certifications, or specializations (e.g., Medical training, Search & Rescue, Fire safety, etc.)"></textarea>
            </div>
            
            <button type="submit" class="btn-submit" id="submitBtn">
                <i class="fas fa-user-plus"></i> Register as Responder
            </button>
        </form>
    </div>
    
    <div class="back-link">
        <a href="/index.html"><i class="fas fa-arrow-left"></i> Back to Login</a>
    </div>
</div>

<script>
    const form = document.getElementById('registrationForm');
    const messageBox = document.getElementById('messageBox');
    const submitBtn = document.getElementById('submitBtn');
    const passwordInput = document.getElementById('password');
    const strengthBar = document.getElementById('strengthBar');
    
    passwordInput.addEventListener('input', function() {
        const password = this.value;
        strengthBar.className = 'password-strength-bar';
        
        if (password.length >= 8 && /[A-Z]/.test(password) && /[0-9]/.test(password)) {
            strengthBar.classList.add('strong');
        } else if (password.length >= 6) {
            strengthBar.classList.add('medium');
        } else if (password.length > 0) {
            strengthBar.classList.add('weak');
        }
    });
    
    function showMessage(text, type) {
        messageBox.innerHTML = `<div class="message ${type}">${text}</div>`;
        window.scrollTo(0, 0);
        setTimeout(() => {
            messageBox.innerHTML = '';
        }, 8000);
    }
    
    form.addEventListener('submit', async function(e) {
        e.preventDefault();
        
        submitBtn.disabled = true;
        submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Registering...';
        
        const name = document.getElementById('name').value.trim();
        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value;
        const phone = document.getElementById('phone').value.trim();
        const location = document.getElementById('location').value;
        const groupClassification = document.querySelector('input[name="groupClassification"]:checked')?.value;
        const additionalDetails = document.getElementById('additionalDetails').value.trim();
        
        if (!name || !email || !password || !phone || !location || !groupClassification) {
            showMessage('Please fill in all required fields', 'error');
            submitBtn.disabled = false;
            submitBtn.innerHTML = '<i class="fas fa-user-plus"></i> Register as Responder';
            return;
        }
        
        if (password.length < 6) {
            showMessage('Password must be at least 6 characters', 'error');
            submitBtn.disabled = false;
            submitBtn.innerHTML = '<i class="fas fa-user-plus"></i> Register as Responder';
            return;
        }
        
        try {
            const response = await fetch('/api/auth/register-responder', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    name: name,
                    email: email,
                    password: password,
                    phone: phone,
                    location: location,
                    assignedZone: location,
                    groupClassification: groupClassification,
                    additionalDetails: additionalDetails
                })
            });
            
            const data = await response.json();
            
            if (data.status === 'success') {
                showMessage('Registration successful! You can now login with your credentials.', 'success');
                setTimeout(() => {
                    window.location.href = '/index.html';
                }, 2000);
            } else {
                showMessage(data.message || 'Registration failed. Please try again.', 'error');
                submitBtn.disabled = false;
                submitBtn.innerHTML = '<i class="fas fa-user-plus"></i> Register as Responder';
            }
        } catch (error) {
            console.error('Registration error:', error);
            showMessage('Network error. Please try again.', 'error');
            submitBtn.disabled = false;
            submitBtn.innerHTML = '<i class="fas fa-user-plus"></i> Register as Responder';
        }
    });
</script>

</body>
</html>
