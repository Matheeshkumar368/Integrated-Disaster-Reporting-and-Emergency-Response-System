# ========================================================
# Production Application Configuration Profile (prod)
# Disaster Management & Emergency Response System
# ========================================================

# Server Configuration
server.port=${PORT:8080}
server.compression.enabled=true
server.compression.mime-types=text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json
server.compression.min-response-size=1024

# Application Identification
spring.application.name=disaster-management-prod

# Database Configuration (MySQL Production)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/disaster_management?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# HikariCP Enterprise Connection Pooling
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:25}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:5}
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1200000
spring.datasource.hikari.connection-test-query=SELECT 1
spring.datasource.hikari.pool-name=DisasterMgmtHikariPool

# JPA / Hibernate Production Settings
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.jdbc.batch_size=30
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# Security & JWT Token Governance
app.jwt.secret=${JWT_SECRET:disaster-management-production-secure-jwt-secret-placeholder-key-368}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
app.admin.step-up-duration-minutes=${ADMIN_STEP_UP_MINUTES:15}

# Production Actuator & Liveness Probes
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when_authorized
management.endpoint.health.probes.enabled=true
management.info.env.enabled=false

# NDMA SACHET National RSS Feed Ingestion
app.ndma.rss-url=${NDMA_RSS_URL:https://sachet.ndma.gov.in/cap_public_website/rss/rss_india.xml}
app.ndma.sync.enabled=${NDMA_SYNC_ENABLED:true}
app.ndma.sync.interval-ms=${NDMA_SYNC_INTERVAL_MS:300000}
app.ndma.sync.initial-delay-ms=${NDMA_SYNC_INITIAL_DELAY_MS:5000}
app.ndma.sync.max-items=${NDMA_SYNC_MAX_ITEMS:50}

# IMD Weather & Forecast APIs
app.imd.api-url=${IMD_API_URL:https://api.imd.gov.in/api}
app.imd.api-key=${IMD_API_KEY:}
app.imd.jwt-token=${IMD_JWT_TOKEN:}
app.weather.fallback-url=${WEATHER_FALLBACK_URL:https://api.open-meteo.com/v1/forecast}

# Persistent Media Storage
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=55MB
app.media.upload-dir=${MEDIA_UPLOAD_DIR:uploads/incident-media}

# Road Routing Engine (OSRM)
app.routing.osrm-url=${OSRM_URL:https://router.project-osrm.org/route/v1/driving}
app.routing.timeout-ms=${ROUTING_TIMEOUT_MS:4000}

# Production Logging
logging.level.root=WARN
logging.level.com.disaster.management=INFO
logging.level.org.springframework.web=WARN
logging.level.org.hibernate=WARN
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n

