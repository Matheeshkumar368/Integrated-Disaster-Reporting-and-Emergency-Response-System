# ========================================================
# Development Application Configuration Profile (dev)
# Disaster Management & Emergency Response System
# ========================================================

# Server Configuration
server.port=${PORT:8080}

# Application Identification
spring.application.name=disaster-management-dev

# Database Configuration (Local MySQL Development)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/disaster_management?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:${spring.datasource.password:}}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# HikariCP Dev Pool Settings
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2

# JPA / Hibernate Dev Settings
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Development JWT Secret
app.jwt.secret=${JWT_SECRET:disaster-management-development-jwt-secret-key-2026-disaster-system-368}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
app.admin.step-up-duration-minutes=${ADMIN_STEP_UP_MINUTES:15}

# Actuator Endpoints for Development
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# NDMA SACHET Live Feed (Dev)
app.ndma.rss-url=${NDMA_RSS_URL:https://sachet.ndma.gov.in/cap_public_website/rss/rss_india.xml}
app.ndma.sync.enabled=${NDMA_SYNC_ENABLED:true}
app.ndma.sync.interval-ms=${NDMA_SYNC_INTERVAL_MS:300000}
app.ndma.sync.initial-delay-ms=${NDMA_SYNC_INITIAL_DELAY_MS:5000}
app.ndma.sync.max-items=${NDMA_SYNC_MAX_ITEMS:30}

# Media Storage
app.media.upload-dir=${MEDIA_UPLOAD_DIR:uploads/incident-media}

# Development Logging
logging.level.root=INFO
logging.level.com.disaster.management=INFO
logging.level.org.springframework.web=INFO
